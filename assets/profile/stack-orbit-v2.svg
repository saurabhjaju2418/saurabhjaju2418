<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#0d1730"/></linearGradient>
  <linearGradient id="e"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
</defs>
<rect width="1200" height="600" rx="28" fill="url(#b)"/>
<rect x="2" y="2" width="1196" height="596" rx="28" fill="none" stroke="url(#e)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#f5f7ff">
  <text x="65" y="65" font-size="18" fill="#247bff" letter-spacing="4">TECHNOLOGY ORBIT</text>
  <text x="65" y="120" font-size="42" font-weight="800">THE ENGINEERING STACK</text>

  <g transform="translate(600 350)" fill="none" stroke="#20365e" stroke-width="2">
    <ellipse rx="470" ry="165"/>
    <ellipse rx="350" ry="115" transform="rotate(25)"/>
    <ellipse rx="245" ry="78" transform="rotate(-25)"/>
  </g>

  <g font-size="19" font-weight="700">
    <g transform="translate(600 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <text x="-450" y="-50">JAVA</text>
        <text x="330" y="-45">SPRING</text>
        <text x="-350" y="125">KUBERNETES</text>
        <text x="270" y="105">AWS</text>
      </g>
    </g>

    <g transform="translate(600 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
        <text x="-60" y="-130">PYTHON</text>
        <text x="-105" y="155">AGENTIC AI</text>
      </g>
    </g>

    <g transform="translate(600 350)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <text x="-510" y="165">DOCKER</text>
        <text x="380" y="165">GITLAB</text>
      </g>
    </g>

    <text x="545" y="355" font-size="30" fill="#247bff">SAURABH</text>
  </g>

  <text x="65" y="555" font-size="15" fill="#71809a">BACKEND · CLOUD · DEVSECOPS · OBSERVABILITY · AI</text>
</g>
</svg>